<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in | Frigdex</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="login-page"><div class="login-card"><a class="brand" href="{{ url_for('home') }}"><span class="brand-icon">❄</span><span><b>FRIGDEX</b><small>ADMINISTRATION</small></span></a><span class="eyebrow dark">SECURE ADMIN AREA</span><h1>Welcome back.</h1><p>Sign in to manage products, enquiries and sales records.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-teal full">Sign in →</button></form><a class="back-link" href="{{ url_for('home') }}">← Return to website</a></div></body></html>
