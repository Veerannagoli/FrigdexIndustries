{% macro icon(name, size=22) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'snow' %}<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/>
{%- elif name == 'deep' %}<rect x="3" y="5" width="18" height="4" rx="1"/><rect x="4" y="9" width="16" height="10" rx="1"/><path d="M10 7h4"/>
{%- elif name == 'visi' %}<rect x="6" y="2.5" width="12" height="19" rx="1.5"/><rect x="8.5" y="5" width="7" height="14"/><path d="M13.5 10v4"/>
{%- elif name == 'bottle' %}<rect x="4" y="10" width="16" height="11" rx="1.5"/><path d="M4 14h16M8 10V5h2.5v5M13.5 10V5H16v5"/>
{%- elif name == 'freezer' %}<rect x="6" y="2.5" width="12" height="19" rx="1.5"/><path d="M6 9h12M9 5.5v1.5M9 12v3"/>
{%- elif name == 'phone' %}<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v3a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>
{%- elif name == 'chat' %}<path d="M4 5h16v11H10l-5 4v-4H4z"/>
{%- elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m3.5 7 8.5 6 8.5-6"/>
{%- elif name == 'pin' %}<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>
{%- elif name == 'overview' %}<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>
{%- elif name == 'products' %}<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>
{%- elif name == 'orders' %}<rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/>
{%- elif name == 'reports' %}<path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/>
{%- endif -%}
</svg>
{%- endmacro %}
